<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliMercado - IPN</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="img/burritovendedor.jpg" alt="IPN Logo" class="ipn-logo">
            PoliMercado
        </div>
        <div class="mascot">
            Burro Blanco 🫏
        </div>
    </nav>

    <main class="view active" id="home-view">
        <h1 class="text-center">¡Bienvenido a PoliMercado!</h1>
        <p class="text-center">El punto de encuentro para comprar y vender en el Instituto Politécnico Nacional.</p>
        <h2 class="text-center" style="margin-top: 2rem; color: var(--guinda);">Nivel Superior</h2>
        
        <div class="school-grid" id="schools-container">
            <!-- Renderizado dinámico desde app.js -->
        </div>
    </main>

    <script type="module" src="app.js"></script>
    <script type="module">
        import { renderSchoolsGrid } from './app.js';
        document.addEventListener("DOMContentLoaded", () => {
            renderSchoolsGrid();
        });
    </script>
</body>
</html>
